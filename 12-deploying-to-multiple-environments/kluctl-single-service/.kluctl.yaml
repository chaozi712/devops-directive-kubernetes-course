targets:
  - name: staging
    args:
      environment: staging
    # Adding a context to .kluctl.yaml helps prevent accidentally deploying to the wrong cluster!
    context: kind-kind

  - name: production
    args:
      environment: production
    # Adding a context to .kluctl.yaml helps prevent accidentally deploying to the wrong cluster!
    context: gke_kubernetes-course-507910_australia-southeast1-b_devops-directive-kubernetes-course

args:
  - name: environment

discriminator: kluctl-{{ target.name }}
